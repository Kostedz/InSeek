name: Backend Tests & Coverage

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/test-backend.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'pom.xml'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: ['25']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java ${{ matrix.java-version }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven

    - name: Run tests with Maven
      run: mvn clean test

    - name: Generate coverage report
      run: mvn jacoco:report

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./target/site/jacoco/jacoco.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false

    - name: Archive test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-results-java-${{ matrix.java-version }}
        path: target/surefire-reports/
        retention-days: 30

    - name: Archive coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage-java-${{ matrix.java-version }}
        path: target/site/jacoco/
        retention-days: 30

    - name: Summarize test results
      if: always()
      id: test_results
      shell: bash
      run: |
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import glob
        import xml.etree.ElementTree as ET

        totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
        for path in glob.glob("target/surefire-reports/TEST-*.xml"):
            try:
                root = ET.parse(path).getroot()
                for key in totals:
                    totals[key] += int(root.attrib.get(key, 0))
            except (ET.ParseError, OSError, ValueError):
                pass

        passed = totals["tests"] - totals["failures"] - totals["errors"] - totals["skipped"]
        print(
            "summary=Tests: {tests} | Passed: {passed} | "
            "Failures: {failures} | Errors: {errors} | Skipped: {skipped}".format(
                passed=passed, **totals
            )
        )
        PY

    - name: Notify Discord
      if: always()
      uses: tsickert/discord-webhook@v7.0.0
      with:
        webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
        username: GitHub Actions
        content: |
          **Workflow:** ${{ github.workflow }}
          **Result:** ${{ job.status }}
          **Triggered by:** ${{ github.actor }}
          **Event:** ${{ github.event_name }}
          **Branch:** ${{ github.ref_name }}
          **Commit:** `${{ github.sha }}`
          **Message:** ${{ github.event.head_commit.message || github.event.pull_request.title || 'Not available' }}
          **${{ steps.test_results.outputs.summary }}**
          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
